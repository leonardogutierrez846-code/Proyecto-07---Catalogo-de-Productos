server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/products/**
          - id: inventory-service
            uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/inventory/**
